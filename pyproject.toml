# Le paquet installable (TP6), puis la configuration des outils de qualité (TP4).

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
dynamic = ["version"]
description = "Analyse de sentiment des avis : modèle TF-IDF, API FastAPI et commande sentiment"
requires-python = ">=3.11"
# Le modèle est un pickle scikit-learn : la même version mineure qu'à l'entraînement.
dependencies = [
    "scikit-learn==1.5.*",
    "joblib>=1.4",
    "fastapi==0.115.*",
    "pydantic>=2.9,<3",
    "uvicorn==0.30.*",
    "httpx==0.27.*",
]

[project.optional-dependencies]
ui = ["streamlit==1.39.*", "pandas==2.2.*"]   # pip install "sentiment-app[ui]" pour l'interface

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sentiment_app.__version__" }

[tool.setuptools.packages.find]
# Seulement le code servi : ni tests, ni données, ni modèle, ni scripts d'entraînement.
include = ["api*", "sentiment_app*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks", "ressources-etudiants"]  # copies des kits, pas du code du projet

[tool.ruff.lint]
# E4, E7, E9, F : erreurs probables ; I : ordre des imports ; B : constructions à risque
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true
